<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#4a3340" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <!-- White border badge -->
  <rect x="8" y="7" width="96" height="96" rx="30" fill="#ffffff" filter="url(#sh)"/>
  <!-- Antigravity deep background -->
  <rect x="15" y="14" width="82" height="82" rx="23" fill="#0f172a"/>
  <!-- Glare -->
  <rect x="20" y="18" width="72" height="36" rx="17" fill="url(#gl)" opacity=".7"/>
  <!-- Google terminal controls -->
  <circle cx="28" cy="24" r="2.5" fill="#ea4335"/>
  <circle cx="35" cy="24" r="2.5" fill="#fbbc05"/>
  <circle cx="42" cy="24" r="2.5" fill="#34a853"/>
  <!-- Floating logo concept -->
  <g transform="translate(30, 30)">
    <!-- Defying gravity A shape with gradients -->
    <path d="M12 48 L26 12 L40 48 M18 36 L34 36" fill="none" stroke="url(#ag-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sparkles defying gravity -->
    <path d="M6 16 L8 18 L6 20 L4 18 Z" fill="#FBBC05"/>
    <path d="M46 22 L47 23 L46 24 L45 23 Z" fill="#34A853"/>
    <path d="M38 8 L39 9 L38 10 L37 9 Z" fill="#4285F4"/>
  </g>
</svg>
