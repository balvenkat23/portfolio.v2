<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#4a3340" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- White border badge -->
  <rect x="8" y="7" width="96" height="96" rx="30" fill="#ffffff" filter="url(#sh)"/>
  <!-- Claude terminal background -->
  <rect x="15" y="14" width="82" height="82" rx="23" fill="#191816"/>
  <!-- Glare -->
  <rect x="20" y="18" width="72" height="36" rx="17" fill="url(#gl)" opacity=".7"/>
  <!-- Terminal controls -->
  <circle cx="28" cy="24" r="2.5" fill="#E66C52"/>
  <circle cx="35" cy="24" r="2.5" fill="#e58e3e"/>
  <circle cx="42" cy="24" r="2.5" fill="#cc6b49"/>
  <!-- Monospace text and prompt -->
  <g transform="translate(26, 36)">
    <text x="0" y="32" font-family="Courier New, Monaco, monospace" font-size="28" font-weight="900" fill="#f7f0e8">&gt;c</text>
    <!-- Cursor -->
    <rect x="42" y="10" width="12" height="24" fill="#E66C52"/>
  </g>
</svg>
